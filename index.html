<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101010">
  <meta name="description" content="Jostify: tu reproductor musical personal.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <title>Jostify</title>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">♫</span><span>jostify</span></div>
    <button id="addBtn" class="icon-btn" aria-label="Añadir música" title="Añadir música">＋</button>
    <input id="filePicker" type="file" accept="audio/*" multiple hidden>
  </header>

  <main>
    <section class="welcome">
      <p class="eyebrow">TU MÚSICA, A TU MANERA</p>
      <h1>Que suene<br><span>lo tuyo.</span></h1>
      <p class="sub">Tu biblioteca musical, sin complicaciones.</p>
      <button id="heroAdd" class="primary-btn">＋ Añadir canciones</button>
    </section>

    <section class="section">
      <div class="section-heading">
        <div><p class="eyebrow">COLECCIÓN</p><h2>Tu biblioteca</h2></div>
        <span id="songCount" class="count">0 canciones</span>
      </div>
      <div id="emptyState" class="empty">
        <div class="empty-icon">♫</div>
        <strong>Tu música empieza aquí</strong>
        <p>Añade archivos de audio que tengas guardados en tu teléfono.</p>
        <button id="emptyAdd" class="secondary-btn">Elegir música</button>
      </div>
      <div id="songList" class="song-list"></div>
    </section>
  </main>

  <footer class="player" id="player">
    <div class="progress-wrap"><input id="seek" type="range" min="0" max="1000" value="0" aria-label="Progreso"></div>
    <div class="player-main">
      <div class="track-art" id="playerArt">♫</div>
      <div class="track-info"><strong id="nowTitle">Elige una canción</strong><span id="nowArtist">Tu biblioteca</span></div>
      <button id="prevBtn" class="control-btn" aria-label="Anterior">⏮</button>
      <button id="playBtn" class="play-btn" aria-label="Reproducir">▶</button>
      <button id="nextBtn" class="control-btn" aria-label="Siguiente">⏭</button>
    </div>
    <div class="time-row"><span id="currentTime">0:00</span><span id="duration">0:00</span></div>
  </footer>

  <audio id="audio" preload="metadata"></audio>
  <div id="toast" class="toast" role="status"></div>
  <script src="app.js"></script>
</body>
</html>
